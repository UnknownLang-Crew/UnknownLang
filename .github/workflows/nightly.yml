name: Nightly Rust

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:
    inputs:
      nightly:
        description: "Create nightly release"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact-name: unknownlang-linux

          - os: windows-latest
            target: windows
            artifact-name: unknownlang-windows

          - os: macos-latest
            target: macos
            artifact-name: unknownlang-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        shell: bash
        run: |
          cargo build --release --message-format=json -q \
            | jq -r 'select(.reason=="compiler-artifact" and .executable != null) | .executable' \
            | tail -n 1 \
            | sed 's/\\/\//g' > executable_path.txt

      - name: Zip artifact
        shell: bash
        run: |
          # -j junks the path, storing only the filename in the zip
          zip -j "${{ matrix.artifact-name }}.zip" "$(cat executable_path.txt)"

      - name: Upload artifact  # ← duplicate removed
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip  # ← removed incorrect dist/ prefix

  create-nightly-release:
    name: Nightly Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    if: ${{ (github.event_name == 'push' || inputs.nightly) && !cancelled() }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish nightly
        uses: andelf/nightly-release@v1  # ← pin to a tag, not @main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: Development Build
          body: |
            This is a nightly build of **Unknown Language** for commit ${{ github.sha }} from ${{ github.ref_name }} branch.

            This is a development release of **Unknown Language**.
            It is not recommended for production use.
            Please use this version only for testing and development.
          files: |
            artifacts/unknownlang-linux/unknownlang-linux.zip
            artifacts/unknownlang-windows/unknownlang-windows.zip
            artifacts/unknownlang-macos/unknownlang-macos.zip